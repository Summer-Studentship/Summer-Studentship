<g id="zone_explanations">
<text x="130.00" y="890.00" font-family="Arial, Helvetica, sans-serif" font-size="24.00" font-weight="700" fill="#31475B" text-anchor="start">Offshore long-wave propagation</text>
<text x="130.00" y="926.00" font-family="Arial, Helvetica, sans-serif" font-size="21.00" font-weight="400" fill="#1B2430" text-anchor="start">Depth-averaged, approximately hydrostatic</text>
<text x="130.00" y="954.00" font-family="Arial, Helvetica, sans-serif" font-size="21.00" font-weight="400" fill="#1B2430" text-anchor="start">tsunami propagation is efficiently represented</text>
<text x="130.00" y="982.00" font-family="Arial, Helvetica, sans-serif" font-size="21.00" font-weight="400" fill="#1B2430" text-anchor="start">by the Regional2D NLSWE model.</text>
<text x="615.00" y="890.00" font-family="Arial, Helvetica, sans-serif" font-size="24.00" font-weight="700" fill="#526137" text-anchor="start">Shelf / shoaling influence</text>
<text x="615.00" y="926.00" font-family="Arial, Helvetica, sans-serif" font-size="21.00" font-weight="400" fill="#1B2430" text-anchor="start">Decreasing water depth and changing bathymetry</text>
<text x="615.00" y="954.00" font-family="Arial, Helvetica, sans-serif" font-size="21.00" font-weight="400" fill="#1B2430" text-anchor="start">increasingly modify wave celerity, amplitude and</text>
<text x="615.00" y="982.00" font-family="Arial, Helvetica, sans-serif" font-size="21.00" font-weight="400" fill="#1B2430" text-anchor="start">waveform toward the coast.</text>
<text x="1100.00" y="890.00" font-family="Arial, Helvetica, sans-serif" font-size="24.00" font-weight="700" fill="#765C26" text-anchor="start">Nearshore transition</text>
<text x="1100.00" y="926.00" font-family="Arial, Helvetica, sans-serif" font-size="21.00" font-weight="400" fill="#1B2430" text-anchor="start">Increasingly local free-surface deformation,</text>
<text x="1100.00" y="954.00" font-family="Arial, Helvetica, sans-serif" font-size="21.00" font-weight="400" fill="#1B2430" text-anchor="start">vertical motion and structure interaction</text>
<text x="1100.00" y="982.00" font-family="Arial, Helvetica, sans-serif" font-size="21.00" font-weight="400" fill="#1B2430" text-anchor="start">motivate transfer toward high-fidelity Local3D</text>
<text x="1100.00" y="1010.00" font-family="Arial, Helvetica, sans-serif" font-size="21.00" font-weight="400" fill="#1B2430" text-anchor="start">impact modelling.</text>
</g>
<g id="interpretive_boundary_note">
<text x="130.00" y="1030.00" font-family="Arial, Helvetica, sans-serif" font-size="18.00" font-weight="400" fill="#56616F" text-anchor="start">Region boundaries are interpretive rather than fixed physical thresholds; the selected wet nearshore interface is the current</text>
<text x="130.00" y="1054.00" font-family="Arial, Helvetica, sans-serif" font-size="18.00" font-weight="400" fill="#56616F" text-anchor="start">case-specific 2D-&gt;3D extraction location.</text>
<text x="130.00" y="1092.00" font-family="Arial, Helvetica, sans-serif" font-size="18.00" font-weight="400" fill="#56616F" text-anchor="start">Profile: R10 h400 corridor-centreline sampling; bed elevation referenced to EGM2008.  b_c(s)=b(x_c(s),y_c(s)).</text>
</g>
</svg>
